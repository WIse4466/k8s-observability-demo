# Day 9 的儀表板，改成宣告式（Day 20 補的）。kubectl apply -f grafana/ 之後 Grafana 幾秒內會自動載入
apiVersion: v1
data:
  checkout-sli.json: |-
    {
      "uid": "checkout-sli",
      "title": "結帳服務 SLI",
      "tags": [
        "day09"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "成功率有沒有掉到 SLO 以下",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.99
                  }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "min": 0.95,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(checkout_total{status=\"success\"}[5m])) / sum(rate(checkout_total[5m]))",
              "legendFormat": "成功率",
              "range": true,
              "exemplar": false
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "結帳慢的是少數人還是所有人",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"gateway\", path=\"/checkout\"}[5m])) by (le))",
              "legendFormat": "P50",
              "range": true,
              "exemplar": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"gateway\", path=\"/checkout\"}[5m])) by (le))",
              "legendFormat": "P95",
              "range": true,
              "exemplar": true
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"gateway\", path=\"/checkout\"}[5m])) by (le))",
              "legendFormat": "P99",
              "range": true,
              "exemplar": true
            }
          ]
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "可觀測性"   # kube-prometheus-stack 的 sidecar 靠這個標籤找儀表板
  name: grafana-dashboard-checkout-sli
  namespace: monitoring
