# Day 15 裝 Loki 時用 --set 打在指令列上的設定，Day 29 補成檔案。
# 全部是為了塞進 kind 的單機叢集：不分角色、不開快取、用測試用的 schema。
backend:
  replicas: 0
chunksCache:
  enabled: false
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  useTestSchema: true
read:
  replicas: 0
resultsCache:
  enabled: false
write:
  replicas: 0
